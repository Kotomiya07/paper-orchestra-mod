[workspace]
name = "paper-orchestra"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"

# Keep the application dependencies in sync with requirements.txt.
[pypi-dependencies]
google-genai = "*"
joblib = "*"
json-repair = "*"
matplotlib = "*"
numpy = "*"
openai = "*"
opencv-python = "*"
pydantic = "*"
pymupdf = "*"
pymupdf4llm = "*"
pyopenssl = "*"
pypdf = "*"
python-dotenv = "*"
requests = "*"
rich = "*"
streamlit = "*"
thefuzz = "*"
tqdm = "*"
pytest = "*"

[tasks]
test = "pytest tests/ -q"
check = "python -m compileall -x '(^|/)[.]pixi(/|$)' ."
